            flex-direction: column;

                        padding: 12px;
                        position: relative;

                body::before {
                        content: "";
                        position: fixed;
                        inset: -40%;
                        background:
                            conic-gradient(from 160deg at 50% 50%,
                                rgba(0, 228, 255, 0.00) 0deg,

                        pointer-events: none;
                        z-index: 0;
                }

                body::after {
                        content: "";
                        position: fixed;
                        inset: 0;
                        background-image:
                            linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
                            linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);

                        opacity: 0.14;
                        pointer-events: none;
                        z-index: 0;
                }

                        to { transform: rotate(360deg); }
                }

        .tree-title {
            font-size: 22px;
            font-weight: 700;
            margin: 8px 0 10px;
            background: linear-gradient(90deg, var(--primary-blue), var(--primary-purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
            z-index: 10;
        }

        /* SVG容器 全屏径向布局 */

            width: 100vw;
            height: calc(100vh - 64px);
            position: relative;
            z-index: 1;
        }

        .tree-svg {
            width: 100%;
            height: 100%;
        }

        .tree-link {
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-dasharray: 1500;
            stroke-dashoffset: 1500;
            animation: linkGrow 2s ease forwards;
            filter: drop-shadow(0 0 6px rgba(0, 228, 255, 0.18));

        .link-level2 { stroke: var(--accent-purple); animation-delay: 0.8s; }
        .link-level3 { stroke: var(--primary-blue); animation-delay: 1.1s; }

            to { stroke-dashoffset: 0; }
        }

        /* 球形节点样式 */
        .node-circle {
            cursor: pointer;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(0,0,0,0.3));
            opacity: 0;
            animation: nodeShow 0.5s ease forwards;

            filter: drop-shadow(0 0 15px currentColor);

            animation: nodeShow 0.5s ease forwards, superPulse 2.2s ease-in-out infinite;

        .node-lightning {

        }
        .node-space {
            animation: nodeShow 0.5s ease forwards, spaceRotate 4s linear infinite;
            filter: drop-shadow(0 0 14px #722ED1);
        }
        .node-neon {
            animation: nodeShow 0.5s ease forwards, neonGlow 2s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 18px #165DFF);
        }

        @keyframes superPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }
        @keyframes neonGlow {
            from { filter: drop-shadow(0 0 10px #165DFF); }
            to { filter: drop-shadow(0 0 22px #165DFF); }
        }
        @keyframes lightningFlash {
            0%, 80%, 100% { filter: drop-shadow(0 0 8px #00E4FF); }
            85% { filter: drop-shadow(0 0 28px #00E4FF) brightness(1.4); }
        }
        @keyframes fireFlicker {
            0%, 100% { filter: drop-shadow(0 0 10px #FFD700); }
            50% { filter: drop-shadow(0 0 20px #FF9500) brightness(1.2); }

        @keyframes spaceRotate {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.08); }
            100% { transform: rotate(360deg) scale(1); }

            to { opacity: 1; }

            font-size: 13px;
            font-weight: 500;
            pointer-events: none;

            color: var(--text-main);

            white-space: nowrap;

            opacity: 0;

            backdrop-filter: blur(10px);
        }

        /* 弹窗样式 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 15, 29, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s ease;

        .modal.active {

            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #121218;
            border: 1px solid #292938;
            color: var(--text-main);
            font-size: 20px;

            font-weight: 700;

                                    担任建模手+编程手，设计动静态对比模型（阿基米德螺线离散点行进模型+速度传递模型+向量碰撞判断模型），通过数理分析锁定最大运行速度节点范围，大幅缩小优化搜索空间，获全国二等奖。</p>
                                    <p><strong>2024年 华数杯全国大学生数学建模竞赛</strong><br>
                                    项目：《机器臂关节角路径的多目标优化设计》</p>
                                    <p><strong>2025年 华数杯全国大学生数学建模竞赛</strong><br>
                                    项目：《多孔膜光反射性能的优化与控制》</p>
                                    <p><strong>2024年 华中杯数学建模竞赛</strong><br>
                                    项目：《大气能量穿透季节时变模型》</p>
                                    <p><strong>湖南大学数学建模竞赛 一等奖</strong><br>
                                    <strong>湖南大学数学竞赛 一等奖</strong></p>
                                `
                            },
                            nodeType: 'large'
                        }
                    ]
                }
            ]
        };

        // 初始化SVG与径向布局
        const svg = d3.select('#treeSvg');
        const width = document.querySelector('.tree-container').clientWidth;
        const height = document.querySelector('.tree-container').clientHeight;
        const radius = Math.min(width, height) / 2 - 120; // 布局半径 预留边距

        // 设置SVG中心坐标
        const g = svg.attr('viewBox', `0 0 ${width} ${height}`)
            .append('g')
            .attr('transform', `translate(${width / 2}, ${height / 2})`);

        // 定义球形渐变
        const defs = g.append('defs');
        // 根节点渐变
        defs.append('radialGradient')
            .attr('id', 'rootGradient')
            .attr('cx', '30%').attr('cy', '30%').attr('r', '100%')
            .html(`<stop offset="0%" stop-color="#6dd5fa" /><stop offset="100%" stop-color="#2980b9" />`);
        // 一级节点渐变
        defs.append('radialGradient')
            .attr('id', 'level1Gradient')
            .attr('cx', '30%').attr('cy', '30%').attr('r', '100%')
            .html(`<stop offset="0%" stop-color="#a78bfa" /><stop offset="100%" stop-color="#7c3aed" />`);
        // 大节点渐变
        defs.append('radialGradient')
            .attr('id', 'largeGradient')
            .attr('cx', '30%').attr('cy', '30%').attr('r', '100%')
            .html(`<stop offset="0%" stop-color="#4fc3f7" /><stop offset="100%" stop-color="#0284c7" />`);
        // 中节点渐变
        defs.append('radialGradient')
            .attr('id', 'mediumGradient')
            .attr('cx', '30%').attr('cy', '30%').attr('r', '100%')
            .html(`<stop offset="0%" stop-color="#6aaf7c" /><stop offset="100%" stop-color="#2d7d46" />`);
        // 小节点渐变
        defs.append('radialGradient')
            .attr('id', 'smallGradient')
            .attr('cx', '30%').attr('cy', '30%').attr('r', '100%')
            .html(`<stop offset="0%" stop-color="#ffb74d" /><stop offset="100%" stop-color="#f97316" />`);

        // 径向树布局
        const tree = d3.tree()
            .size([2 * Math.PI, radius])
            .separation((a, b) => (a.parent === b.parent ? 1.2 : 2) / a.depth);

        // 处理层级数据
        const root = d3.hierarchy(treeData);
        tree(root);

        // 绘制连线
        const link = g.selectAll('.tree-link')
            .data(root.links())
            .join('path')
            .attr('class', d => `tree-link link-level${d.source.depth}`)
            .attr('d', d3.linkRadial()
                .angle(d => d.x)
                .radius(d => d.y)
            );

        // 绘制节点组
        const node = g.selectAll('.node')
            .data(root.descendants())
            .join('g')
            .attr('class', 'node')
            .attr('transform', d => `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y},0) rotate(${-(d.x * 180 / Math.PI - 90})`);

        // 绘制球形节点
        node.append('circle')
            .attr('class', d => `node-circle node-${d.data.nodeType} ${d.data.specialClass || ''}`)
            .on('mouseover', function(event, d) {
                // 显示tooltip
                if (d.data.tooltip || d.data.fullName) {
                    const tooltip = document.getElementById('tooltip');
                    tooltip.innerHTML = d.data.fullName || d.data.tooltip;
                    tooltip.classList.add('show');
                    tooltip.style.left = event.pageX + 10 + 'px';
                    tooltip.style.top = event.pageY + 10 + 'px';
                }
                // 高亮连线
                d3.selectAll('.tree-link').style('opacity', 0.2);
                let current = d;
                while (current.parent) {
                    d3.selectAll(`.tree-link`)
                        .filter(l => l.target === current)
                        .style('opacity', 1)
                        .style('stroke-width', 3);
                    current = current.parent;
                }
            })
            .on('mouseout', function() {
                // 隐藏tooltip
                document.getElementById('tooltip').classList.remove('show');
                // 恢复连线
                d3.selectAll('.tree-link')
                    .style('opacity', 1)
                    .style('stroke-width', 2);
            })
            .on('click', function(event, d) {
                // 跳转链接
                if (d.data.link) {
                    window.open(d.data.link, '_blank');
                }
                // 打开弹窗
                if (d.data.modal) {
                    openModal(d.data.modal.title, d.data.modal.content, d.data.modal.key);
                }
            });

        // 绘制节点文本
        node.append('text')
            .attr('class', d => `node-text text-${d.data.nodeType} ${d.data.nodeType === 'small' ? 'text-small' : ''}`)
            .text(d => d.data.name);

        // 弹窗控制
        function openModal(title, content, key) {
            try {
                if (key && window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'OPEN_HERO_NODE_MODAL', key, title }, '*');
                    return;
                }
            } catch (e) {}
            const modal = document.getElementById('modal');
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalContent').innerHTML = content;
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal')) closeModal();
        });

        // 鼠标跟随tooltip
        document.addEventListener('mousemove', (e) => {
            const tooltip = document.getElementById('tooltip');
            if (tooltip.classList.contains('show')) {
                tooltip.style.left = e.pageX + 10 + 'px';
                tooltip.style.top = e.pageY + 10 + 'px';
            }
        });

        // 窗口大小自适应重绘
        window.onresize = () => {
            window.location.reload();
        };
    </script>
</body>
</html>
