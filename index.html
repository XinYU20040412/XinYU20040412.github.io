<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>适配窗口的画布节点</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            /* 画布居中显示，适配电脑窗口 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f5f5;
        }
        /* 画布核心样式：限制最大尺寸，绝不超出电脑窗口 */
        #canvas {
            border: 2px solid #333;
            background: #ffffff;
            /* 最大宽度：电脑窗口90%，最大高度：电脑窗口80%，绝对不会超大 */
            max-width: 90vw;
            max-height: 80vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

<script>
    // ===================== 核心修改：画布尺寸（适配电脑窗口，绝不超大） =====================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    // 基础画布大小（远小于电脑窗口，配合CSS最大尺寸限制）
    canvas.width = 800;   // 画布宽度：标准电脑窗口适配尺寸
    canvas.height = 500;  // 画布高度：标准电脑窗口适配尺寸

    // ===================== 核心修改：节点大小（大幅缩小，正常视觉比例） =====================
    // 节点配置：半径18px，超小尺寸，完全符合窗口显示
    const nodeConfig = {
        radius: 18,        // 节点大小（缩小后！原来的超大尺寸已删除）
        color: '#4285F4',  // 节点颜色
        borderColor: '#2563eb'
    };

    // 绘制节点（均匀分布在画布上，不拥挤、不超大）
    function drawNodes() {
        // 节点坐标（适配小画布，均匀排列）
        const nodes = [
            { x: 150, y: 100 },
            { x: 400, y: 100 },
            { x: 650, y: 100 },
            { x: 150, y: 250 },
            { x: 400, y: 250 },
            { x: 650, y: 250 },
            { x: 400, y: 400 }
        ];

        // 循环绘制所有节点
        nodes.forEach(node => {
            // 绘制节点边框
            ctx.beginPath();
            ctx.arc(node.x, node.y, nodeConfig.radius, 0, Math.PI * 2);
            ctx.fillStyle = nodeConfig.color;
            ctx.fill();
            ctx.strokeStyle = nodeConfig.borderColor;
            ctx.lineWidth = 2;
            ctx.stroke();

            // 绘制节点文字（适配小节点）
            ctx.fillStyle = '#fff';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('节点', node.x, node.y);
        });
    }

    // 初始化绘制
    drawNodes();
</script>
</body>
</html>
